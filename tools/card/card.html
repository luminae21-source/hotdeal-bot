<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>핫딜픽 카드 렌더러</title><style>
@font-face{font-family:Pretendard;font-weight:500;src:url(https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Medium.woff2) format('woff2')}@font-face{font-family:Pretendard;font-weight:700;src:url(https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Bold.woff2) format('woff2')}@font-face{font-family:Pretendard;font-weight:800;src:url(https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-ExtraBold.woff2) format('woff2')}@font-face{font-family:Pretendard;font-weight:900;src:url(https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Black.woff2) format('woff2')}*{box-sizing:border-box}body{margin:0;background:#d8e4e2;font-family:Pretendard,'Noto Sans KR',sans-serif;color:#223845}.card{position:relative;width:1080px;height:1350px;background:#E8F4F1;padding:34px 55px 30px;overflow:hidden;display:flex;flex-direction:column}.disclosure{font-size:23px;font-weight:700;line-height:1.4;min-height:70px;border-bottom:2px solid #c7dbd6;padding-bottom:12px}.head{display:flex;align-items:center;justify-content:space-between;margin-top:20px}.brand{display:flex;align-items:center;gap:12px;font-size:42px;font-weight:900;color:#223845}.brandmark{background:#F33430;color:#fff;padding:8px 15px;border-radius:18px;font-size:38px}.mall{font-size:24px;background:#fff;padding:10px 20px;border-radius:30px;color:#426765;font-weight:800}.title{font-size:57px;font-weight:900;margin:20px 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.timestamp{font-size:24px;color:#426765;margin-bottom:18px}.items{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}.item{background:white;border-radius:24px;flex:1;min-height:0;max-height:250px;padding:14px 22px;display:grid;grid-template-columns:125px 1fr 250px;gap:18px;align-items:center;box-shadow:0 3px 12px #2238450d}.thumb{width:125px;height:125px;object-fit:contain;border-radius:14px;background:#f2f6f5}.thumb.empty{display:flex;align-items:center;justify-content:center;color:#8a9e9a;font-size:20px}.name{font-size:30px;line-height:1.22;font-weight:800;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}.unit{font-size:25px;font-weight:900;color:#426765;margin-top:10px}.price{text-align:right;font-size:43px;font-weight:900;color:#F33430;white-space:nowrap}.cond{font-size:24px;color:#F33430;font-weight:800;margin-top:4px;text-align:right}.itemtime{font-size:19px;color:#526e6c;margin-top:8px;text-align:right}.footer{margin-top:14px;border-top:2px solid #c7dbd6;padding-top:15px;display:flex;justify-content:space-between;font-size:23px;font-weight:800;color:#426765}.footnote{margin-top:12px;font-size:23px;color:#223845;font-weight:800}.footnote:empty{display:none}.error{font-size:28px;color:#a12220;padding:20px;border:2px solid #F33430;background:white}
</style></head><body><main class="card" id="card"><div class="disclosure" id="disclosure"></div><div class="head"><div class="brand"><span class="brandmark">딜</span>핫딜픽</div><div class="mall" id="mall"></div></div><h1 class="title" id="title"></h1><div class="timestamp" id="checked"></div><div class="items" id="items"></div><div class="footnote" id="footnote"></div><footer class="footer"><span>hotdealpick.kr</span><span>결제 전 최종가 확인</span></footer></main><script>
'use strict';const MALL={coupang:{label:'🚀 쿠팡',disclosure:'이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.'},toss:{label:'💙 토스',disclosure:'이 콘텐츠는 토스쇼핑 쉐어링크 활동의 일환으로, 링크를 통한 구매가 발생하면 일정 수수료를 지급받습니다.'},naver:{label:'네이버',disclosure:'이 포스팅은 네이버 쇼핑 커넥트 활동의 일환으로, 판매 발생 시 수수료를 제공받습니다.'}};
const FORBIDDEN=/(최저가|미백|다이어트|면역|직접\s*써|써\s*봤|사용해\s*봤|제가\s*사용|효능)/i;
function fail(s){document.getElementById('items').innerHTML='';const el=document.createElement('div');el.className='error';el.textContent=s;document.getElementById('items').append(el);document.documentElement.dataset.ready='error';}
function validDate(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$/.test(s)&&!Number.isNaN(new Date(s.replace(' ','T')).getTime())}
function add(parent,cls,txt){const x=document.createElement('div');x.className=cls;x.textContent=txt;parent.append(x);return x}
async function render(){try{const path=new URLSearchParams(location.search).get('data');if(!path||!/^([a-zA-Z0-9_-]+\/)*[a-zA-Z0-9_-]+\.json$/.test(path))throw Error('허용된 상대경로 JSON 파일이 필요합니다.');const res=await fetch(path,{cache:'no-store'});if(!res.ok)throw Error('JSON 파일을 불러올 수 없습니다.');const d=await res.json();if(!MALL[d.mall])throw Error('몰 값은 coupang/toss/naver 중 하나여야 합니다.');if(typeof d.title!=='string'||!d.title.trim()||FORBIDDEN.test(d.title))throw Error('제목이 비어 있거나 금지 표현이 있습니다.');if(!validDate(d.checked))throw Error('전체 확인 시각이 올바르지 않습니다.');if(!Array.isArray(d.items))throw Error('items 배열이 필요합니다.');const eligible=d.items.filter(i=>i&&typeof i.name==='string'&&i.name.trim()&&typeof i.price==='string'&&i.price.trim()&&validDate(i.checked));if(eligible.length<3||eligible.length>5)throw Error('가격과 확인 시각이 검증된 상품이 3~5개여야 합니다.');for(const i of eligible){if(FORBIDDEN.test([i.name,i.unit||'',i.cond||''].join(' ')))throw Error('금지 표현이 포함된 상품이 있습니다.');if(i.cond&&!['와우가','쿠폰가','회원가'].includes(i.cond))throw Error('허용되지 않는 가격 조건입니다.');if(!/^\d{1,3}(,\d{3})*원$/.test(i.price))throw Error('가격 표기가 올바르지 않습니다.');if(i.url&&(!/^https:\/\//.test(i.url)))throw Error('상품 URL은 HTTPS여야 합니다.');}
// Affiliate disclosure is intentionally hardcoded, never read from JSON.
document.getElementById('disclosure').textContent=MALL[d.mall].disclosure;document.getElementById('mall').textContent=MALL[d.mall].label;document.getElementById('title').textContent=d.title;const md=x=>`${Number(x.slice(5,7))}/${Number(x.slice(8,10))} ${x.slice(11)}`;document.getElementById('checked').textContent=`${md(d.checked)} 확인 가격`;const list=document.getElementById('items');list.classList.add('count'+eligible.length);for(const i of eligible){const row=document.createElement('div');row.className='item';if(i.img){const im=document.createElement('img');im.className='thumb';im.alt='상품 이미지';im.src=i.img;row.append(im)}else add(row,'thumb empty','이미지 없음');const mid=document.createElement('div');add(mid,'name',i.name);if(i.unit)add(mid,'unit',i.unit);row.append(mid);const right=document.createElement('div');add(right,'price',i.price);if(i.cond)add(right,'cond',i.cond);if(i.checked!==d.checked)add(right,'itemtime',md(i.checked)+' 확인');row.append(right);list.append(row)}if(d.mall==='toss'){const [date,time]=d.checked.split(' ');document.getElementById('footnote').textContent=`⚠️ ${Number(date.slice(5,7))}/${Number(date.slice(8,10))} ${time} 게시 시점 가격`;}await Promise.all([...document.images].map(im=>im.decode().catch(()=>{})));await document.fonts.ready;document.documentElement.dataset.ready='ok';}catch(e){fail(e.message)}}render();
</script></body></html>
