name: hotdeal
on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # 24시간 15분마다(밤 0~8시는 무음 게시). 정각·30분은 GitHub 혼잡 시간이라 지연·누락이 잦아서 피함
  workflow_dispatch:               # GitHub 앱에서 'Run workflow'로 즉시 실행
concurrency: hotdeal
permissions:
  contents: write                  # posts.json / docs(웹사이트·카드) 커밋용
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5     # 이미 본 글 목록(seen.json) + 카드용 한글 폰트 + 토스 API 토큰(toss.json, 1년짜리) + 릴스 배경음악(music/, Pixabay에서 1번만 받음) 유지
        with:
          path: |
            seen.json
            fonts
            toss.json
            music
          key: seen-${{ github.run_id }}
          restore-keys: seen-
      - run: |                     # 카드 이미지용: Pillow + 나눔고딕(Google Fonts, OFL). 있으면 건너뜀
          python -c "import PIL" 2>/dev/null || pip install -q pillow
          mkdir -p fonts && for w in ExtraBold Regular; do
            [ -s fonts/NanumGothic-$w.ttf ] || curl -sSL -o fonts/NanumGothic-$w.ttf "https://github.com/google/fonts/raw/main/ofl/nanumgothic/NanumGothic-$w.ttf"
          done
      - run: |                     # 토스 쉐어링크 API는 등록한 고정 IP에서만 받음 -> 오라클 무료 서버로 SSH 터널, sharelink.toss.im만 그 서버를 거침 (시크릿 없으면 건너뜀)
          [ -n "$HOST" ] || exit 0
          install -m 600 /dev/null ~/toss_key && printf '%s\n' "$KEY" > ~/toss_key
          sudo ssh -i ~/toss_key -o StrictHostKeyChecking=accept-new -o ExitOnForwardFailure=yes -o ConnectTimeout=15 \
            -f -N -L 127.0.0.2:443:sharelink.toss.im:443 "$HOST" \
            && echo "127.0.0.2 sharelink.toss.im" | sudo tee -a /etc/hosts >/dev/null \
            || echo "::warning::토스 터널 연결 실패 -> 이번 실행은 토스 딜을 사본(수동)으로"
        env:
          HOST: ${{ secrets.TOSS_TUNNEL_HOST }}   # ubuntu@서버IP (우분투 기본 사용자)
          KEY: ${{ secrets.TOSS_TUNNEL_KEY }}     # 서버 만들 때 받은 개인 키 파일 내용
      - run: python hotdeal.py && python build_site.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_ADMIN_ID: ${{ secrets.TG_ADMIN_ID }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}       # 인스타 자동 게시: 대시보드 '계정 추가' Instagram 토큰(IGAA…, 60일, 카드 사진) 또는 페이스북 페이지 토큰(EAA…, 릴스까지)
          IG_USER_ID: ${{ secrets.IG_USER_ID }}   # 인스타 프로페셔널 계정 ID(숫자)
          TOSS_ACCESS_KEY: ${{ secrets.TOSS_ACCESS_KEY }}
          TOSS_SECRET_KEY: ${{ secrets.TOSS_SECRET_KEY }}
          TOSS_PUBLISHER_ID: ${{ secrets.TOSS_PUBLISHER_ID }}
          MIN_SCORE: ${{ vars.MIN_SCORE }}
          MODEL: ${{ vars.MODEL }}
      - run: |                     # 게시된 딜·카드가 있으면 사이트 갱신 커밋
          git config user.name hotdeal-bot && git config user.email hotdeal-bot@users.noreply.github.com
          git add -A docs && [ -f posts.json ] && git add posts.json
          [ ! -f music.json ] || git add music.json   # 릴스 배경음악 목록(텔레그램 file_id만, 음원 파일 아님)
          git diff --cached --quiet || (git commit -m "site: $(date -u +%F_%H%M)" && (git push || (git pull --rebase -q && git push)))  # 그사이 다른 커밋이 있으면 위에 얹어서 재시도
