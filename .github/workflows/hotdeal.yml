name: hotdeal
on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # 24시간 15분마다(밤 0~8시는 무음 게시). 정각·30분은 GitHub 혼잡 시간이라 지연·누락이 잦아서 피함
  workflow_dispatch:               # GitHub 앱에서 'Run workflow'로 즉시 실행
    inputs:
      metrics_day:                 # 성과 숫자(metrics.json)를 그날 것으로 바로 모음 — 평소엔 비워 둠(매일 5시 넘어 어제 것 자동)
        description: "성과 숫자 바로 모을 날짜 YYYY-MM-DD (보통 비움)"
        required: false
      cold_start:                  # seen.json 캐시가 다 지워졌을 때만 체크(처음부터 — 하루 1번 글이 다시 나갈 수 있음). 평소엔 끔 = 캐시 못 받은 실행은 건너뜀
        description: "봇 기억(seen.json) 없이 처음부터 실행 (캐시가 다 지워졌을 때만)"
        type: boolean
        required: false
      restore_seen:                # 캐시 복구(1번): 예전 캐시 key(seen-실행번호)의 seen.json을 지금 것과 합침(같은 칸은 지금 값) + music/ 되살림, toss.json은 지금 것. 평소엔 비움
        description: "캐시 복구: 합칠 예전 캐시 key (예: seen-39915733544, 보통 비움)"
        required: false
concurrency: hotdeal
permissions:
  contents: write                  # posts.json / docs(웹사이트·카드) 커밋용
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main                # 대기열에서 기다린 실행도 최신 main으로(기본 = 실행 예약 때 커밋 -> 앞 실행의 사이트 커밋과 충돌해 push 실패, 10/9 #376)
      - uses: actions/cache@v5     # 이미 본 글 목록(seen.json) + 카드용 한글 폰트 + 토스 API 토큰(toss.json, 1년짜리) + 릴스 배경음악(music/, Pixabay에서 1번만 받음) 유지
        with:
          path: |
            seen.json
            fonts
            toss.json
            music
          key: seen-${{ github.run_id }}
          restore-keys: seen-
      - uses: actions/cache@v5     # BB 인스타 카드 동물 사진(docs/cards/ANIMALS.md 표의 Pixabay 원본 — 1번만 받음 · 공개 저장소 X · Claude 확인 ok.json) — 위 캐시와 따로(위 경로 목록 = 캐시 버전이라 안 건드림)
        with:
          path: animals
          key: animals-${{ github.run_id }}
          restore-keys: animals-
      - if: ${{ inputs.restore_seen }}   # 캐시 복구(10/23 16:21 빈 seen 저장 뒤 3일 기록 되살리기): 지금 seen·토큰을 옆에 두고 예전 캐시를 받은 다음 합침
        run: mkdir -p .seen_now && cp seen.json .seen_now/ && { [ ! -f toss.json ] || cp toss.json .seen_now/; }
      - if: ${{ inputs.restore_seen }}
        uses: actions/cache/restore@v5
        with:
          path: |                  # 위 캐시와 똑같은 목록이어야 받아짐(캐시 버전 = 경로 목록)
            seen.json
            fonts
            toss.json
            music
          key: ${{ inputs.restore_seen }}
          fail-on-cache-miss: true
      - if: ${{ inputs.restore_seen }}
        run: |
          python3 -c "import json; o, n = json.load(open('seen.json')), json.load(open('.seen_now/seen.json')); print('seen 합침', len(o), '+', len(n), end=' -> '); o.update(n); json.dump(o, open('seen.json', 'w')); print(len(o))"
          [ ! -f .seen_now/toss.json ] || cp .seen_now/toss.json toss.json
          rm -rf .seen_now
      - run: |                     # 카드 이미지용: Pillow + 나눔고딕(Google Fonts, OFL). 있으면 건너뜀
          python -c "import PIL" 2>/dev/null || pip install -q pillow
          mkdir -p fonts && for w in ExtraBold Regular; do
            [ -s fonts/NanumGothic-$w.ttf ] || curl -sSL -o fonts/NanumGothic-$w.ttf "https://github.com/google/fonts/raw/main/ofl/nanumgothic/NanumGothic-$w.ttf"
          done
      - run: |                     # 토스 쉐어링크 API는 등록한 고정 IP에서만 받음 -> 오라클 무료 서버로 SSH 터널, sharelink.toss.im 호출만 그 서버를 거침 (시크릿 없으면 건너뜀)
          [ -n "$HOST" ] || exit 0
          install -m 600 /dev/null ~/toss_key && printf '%s\n' "$KEY" > ~/toss_key
          sudo ssh -i ~/toss_key -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR -o ExitOnForwardFailure=yes -o ConnectTimeout=15 \
            -f -N -L 127.0.0.2:443:sharelink.toss.im:443 "$HOST" \
            && echo "127.0.0.2 sharelink.toss.im" | sudo tee -a /etc/hosts >/dev/null \
            || { echo "::warning::토스 터널 연결 실패 -> 이번 실행은 토스 딜을 사본(수동)으로"; exit 0; }
          # 뽐뿌 글 페이지는 GitHub·오라클 서버 IP 둘 다 403(10/5 linkcheck·10/9 터널 확인) = 서버 접속을 막는 의도된 차단 -> 우회하지 않음(10/5 결정). 뽐뿌 딜은 사본 답장·'같은 상품 찾기'
        env:
          HOST: ${{ secrets.TOSS_TUNNEL_HOST }}   # ubuntu@서버IP (우분투 기본 사용자)
          KEY: ${{ secrets.TOSS_TUNNEL_KEY }}     # 서버 만들 때 받은 개인 키 파일 내용
      - run: python hotdeal.py && python build_site.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_ADMIN_ID: ${{ secrets.TG_ADMIN_ID }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}  # 릴스 나레이션(Google Cloud Text-to-Speech — 진우가 GCP에서 키 만들어 Secrets에 직접, 'Text-to-Speech API만' 제한 권장 · 없으면 글자+음악)
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}  # E 반응 점수(사이트 구매 클릭·딜 쪽 조회 읽기 — 진우가 GoatCounter API 키 Read statistics만 만들어 시크릿에 직접)
          IG_TOKEN: ${{ secrets.IG_TOKEN }}       # 인스타 자동 게시: 대시보드 '계정 추가' Instagram 토큰(IGAA…, 60일, 카드 사진) 또는 페이스북 페이지 토큰(EAA…, 릴스까지)
          IG_USER_ID: ${{ secrets.IG_USER_ID }}   # 인스타 프로페셔널 계정 ID(숫자)
          TOSS_ACCESS_KEY: ${{ secrets.TOSS_ACCESS_KEY }}
          TOSS_SECRET_KEY: ${{ secrets.TOSS_SECRET_KEY }}
          TOSS_PUBLISHER_ID: ${{ secrets.TOSS_PUBLISHER_ID }}
          NAVER_HUB_ID: ${{ secrets.NAVER_HUB_ID }}          # 네이버 API HUB 쇼핑인사이트(DDD trend.json — 진우가 넣으면 켜짐, 없으면 건너뜀)
          NAVER_HUB_SECRET: ${{ secrets.NAVER_HUB_SECRET }}
          MIN_SCORE: ${{ vars.MIN_SCORE }}
          MODEL: ${{ vars.MODEL }}
          METRICS_DAY: ${{ inputs.metrics_day }}
          COLD_START: ${{ inputs.cold_start }}
      - run: |                     # 게시된 딜·카드가 있으면 사이트 갱신 커밋
          git config user.name hotdeal-bot && git config user.email hotdeal-bot@users.noreply.github.com
          git add -A docs && [ -f posts.json ] && git add posts.json
          [ ! -f music.json ] || git add music.json   # 릴스 배경음악 목록(텔레그램 file_id만, 음원 파일 아님)
          [ ! -f metrics.json ] || git add metrics.json   # 글별 조회·반응(아침 보고용)
          [ ! -f top.json ] || git add top.json   # 잘 된 상품 표(Cowork 재게시·토스 후보 가산)
          [ ! -f gc_top.json ] || git add gc_top.json   # 사이트 많이 본 순서(1시간 1번 GoatCounter — 순서만, 숫자 X)
          [ ! -f link_ab.json ] || git add link_ab.json   # /link A·B 하루 집계(10/26~11/8 — 보기·상품 클릭·채널 클릭 수, 주문·수수료 X)
          [ ! -f toss_list.json ] || git add toss_list.json   # 진우 토스 상품 목록(매일 아침 8시 전 — Cowork 8:30 보고, 토스 API 가격 X)
          [ ! -f ig_stage.json ] || git add ig_stage.json   # 인스타 단계 기록(하루 4번 -> 5 -> 6, 매일 0시 판정 줄)
          [ ! -f cp_links.json ] || git add cp_links.json   # 쿠팡 상품 주소 -> 파트너스 링크(쿠팡 키 있을 때만 생김 — 사이트 빌드도 씀)
          [ ! -f cp_sub.json ] || git add cp_sub.json   # GGG 쿠팡 상품 주소 -> 채널별 파트너스 링크(subId — 쿠팡 보고서 '채널 ID' · 사이트 빌드도 씀)
          [ ! -f promo_links.json ] || git add promo_links.json   # 기획전 주소 -> 링크프라이스 딥링크(G마켓·옥션·롯데온·SSG — 공개 링크)
          [ ! -f cp_fail.json ] || git add cp_fail.json   # 아직 안 바뀐 쿠팡 상품 주소(pid·이름·실패 날짜·마지막 시도·이유 — 가격·수수료 X)
          [ ! -f relink.json ] || git add relink.json   # 사이트 생 주소 -> 수수료 링크(바뀐 수·끝까지 안 된 상품 pid·이름·응답 — 가격·수수료 X)
          [ ! -f trend.json ] || git add trend.json   # 품목 흐름(네이버 쇼핑인사이트 오르는 품목·구글 실검 — Cowork 진열 소재, 숫자 = 상대 비율만)
          [ ! -f price_hist.json ] || git add price_hist.json   # 쿠팡 가격 추적(상품 키 -> [시각, 가격, 와우·쿠폰 표시, 출처] — 공개 가격만, 토스 X)
          [ ! -f auto_events.json ] || git add auto_events.json   # 봇이 만든 진열·예약(10/30 Cowork 크롬 이관 — events.json은 Cowork 것 그대로)
          git diff --cached --quiet || (git commit -m "site: $(date -u +%F_%H%M)" && (git push || (git pull --rebase -q && git push)))  # 그사이 다른 커밋이 있으면 위에 얹어서 재시도
