name: linkcheck                     # 새 딜 출처별로 글 -> 쇼핑몰 주소 -> 제휴 링크가 GitHub 서버에서 되는지: Actions → linkcheck → Run workflow → 로그 확인
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - run: |
          python - <<'PY'
          import hotdeal as H
          ds = H.fetch_deals()
          for b in dict.fromkeys(d["board"] for d in ds):
              bd = [d for d in ds if d["board"] == b]
              print(f"== {b} {len(bd)}건")
              for d in bd[:3]:
                  u = H.store_link(d["url"])
                  print(" ", d["title"][:28], "|", u, "|", H.affiliate(u)[1] if u else "-", "|", H.store_info(d["title"], u or "")[:12])
          PY
